name: stage2-identity-reference-ab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/data/identity_tone_sample.txt'
      - '.github/workflows/stage2-identity-reference-ab.yml'

concurrency:
  group: stage2-identity-reference-ab
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Stage 2 repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Recover accepted Stage 1 listening references transiently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/private/stage1_accepted outputs/identity_reference_ab
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/english_listening_sample.wav
          test -s data/private/stage1_accepted/mixed_listening_sample.wav
          python - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/stage2-omnivoice-human-quality.yml').read_text(encoding='utf-8')
          match = re.search(r"printf\s+'%s'\s+'([^']+)'", workflow)
          if not match:
              raise SystemExit('Could not recover established transient English reference text')
          Path('data/private/stage1_accepted/english_reference.txt').write_text(match.group(1), encoding='utf-8')
          PY
          test -s data/private/stage1_accepted/english_reference.txt

      - name: Generate reference A with current English conditioning
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/identity_tone_sample.txt \
            --reference data/private/stage1_accepted/english_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/english_reference.txt \
            --output-wav outputs/identity_reference_ab/reference_A_current_english.wav \
            --output-mp3 outputs/identity_reference_ab/reference_A_current_english.mp3 \
            --report outputs/identity_reference_ab/reference_A_report.json \
            --num-steps 20

      - name: Prepare mixed reference transcript safely
        shell: bash
        run: |
          set -euo pipefail
          # Exact public Stage-1 mixed target used to create mixed_listening_sample.wav.
          python - <<'PY'
          from pathlib import Path
          text = 'வணக்கம், this is my voice. இன்று Kubernetes சரியாக வேலை செய்கிறது.'
          Path('data/private/stage1_accepted/mixed_reference.txt').write_text(text, encoding='utf-8')
          PY
          test -s data/private/stage1_accepted/mixed_reference.txt

      - name: Generate reference B with mixed-language conditioning
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/identity_tone_sample.txt \
            --reference data/private/stage1_accepted/mixed_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/mixed_reference.txt \
            --output-wav outputs/identity_reference_ab/reference_B_mixed.wav \
            --output-mp3 outputs/identity_reference_ab/reference_B_mixed.mp3 \
            --report outputs/identity_reference_ab/reference_B_report.json \
            --num-steps 20

      - name: Remove transient references
        if: always()
        shell: bash
        run: |
          rm -rf data/private

      - name: Upload safe A/B listening samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-identity-reference-ab
          path: |
            outputs/identity_reference_ab/reference_A_current_english.wav
            outputs/identity_reference_ab/reference_A_current_english.mp3
            outputs/identity_reference_ab/reference_A_report.json
            outputs/identity_reference_ab/reference_B_mixed.wav
            outputs/identity_reference_ab/reference_B_mixed.mp3
            outputs/identity_reference_ab/reference_B_report.json
          if-no-files-found: warn
          retention-days: 7
