name: p6-indian-english-codeswitch

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tamil_audiobook/prosody.py'
      - 'tests/test_p5_native_performance.py'
      - '.github/workflows/p6-indian-english-codeswitch.yml'
  push:
    branches: [main]
    paths:
      - 'tamil_audiobook/prosody.py'
      - '.github/workflows/p6-indian-english-codeswitch.yml'

concurrency:
  group: p6-indian-english-codeswitch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  listening-pack:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Download accepted Stage 1 reference transiently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/private outputs/p6-indian-english-codeswitch
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/english_listening_sample.wav
          printf '%s' 'This is my natural English voice, speaking clearly and smoothly.' \
            > data/private/stage1_accepted/english_reference.txt

      - name: Generate P6 code-switch samples
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/voice_quality_benchmark.py \
            --reference data/private/stage1_accepted/english_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/english_reference.txt \
            --output-dir outputs/p6-indian-english-codeswitch \
            --case chennai-01 \
            --case chennai-02 \
            --case tanglish-01 \
            --case tanglish-02 \
            --case codeswitch-01 \
            --case codeswitch-02 \
            --case dialogue-02 \
            2> >(tee outputs/p6-indian-english-codeswitch/resource_usage.txt >&2)

      - name: Validate P6 listening pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/p6-indian-english-codeswitch')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          expected = {
              'chennai-01', 'chennai-02', 'tanglish-01', 'tanglish-02',
              'codeswitch-01', 'codeswitch-02', 'dialogue-02',
          }
          actual = {case['id'] for case in manifest['cases']}
          if actual != expected:
              raise SystemExit(f'Unexpected case set: {sorted(actual)}')
          for case_id in sorted(expected):
              for name in ('sample.wav', 'sample.mp3', 'report.json'):
                  path = root / case_id / name
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f'Missing listening artifact: {path}')
          print('p6_indian_english_codeswitch=READY_FOR_USER_LISTENING')
          print('p6_case_count=' + str(len(expected)))
          PY

      - name: Remove transient material
        if: always()
        shell: bash
        run: |
          rm -rf data/private
          rm -f outputs/p6-indian-english-codeswitch/resource_usage.txt

      - name: Upload P6 listening pack
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p6-indian-english-codeswitch-listening-pack
          path: |
            outputs/p6-indian-english-codeswitch/manifest.json
            outputs/p6-indian-english-codeswitch/*/sample.wav
            outputs/p6-indian-english-codeswitch/*/sample.mp3
            outputs/p6-indian-english-codeswitch/*/report.json
          if-no-files-found: error
          retention-days: 7
