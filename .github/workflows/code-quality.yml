name: code-quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Static syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup_macos.sh scripts/provision_original_voice.sh scripts/load_chosen_default_voice.sh
          node --check tamil_audiobook/static/app.js
          node --check tamil_audiobook/static/progressive.js
          node --check playwright.config.js
          node --check e2e/ui.spec.js
          python -m compileall -q tamil_audiobook scripts tests e2e

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.4.6 \
            soundfile==0.14.0 \
            pytest==9.1.1 \
            fastapi==0.141.1 \
            python-multipart==0.0.32 \
            pypdf==6.15.0 \
            ruff==0.12.10 \
            imageio-ffmpeg==0.6.0
          mkdir -p "$HOME/.local/bin"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import imageio_ffmpeg

          source = Path(imageio_ffmpeg.get_ffmpeg_exe())
          target = Path.home() / ".local" / "bin" / "ffmpeg"
          shutil.copy2(source, target)
          target.chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(str(target.parent) + "\n")
          PY

      - name: Lint Python
        shell: bash
        run: |
          set -euo pipefail
          ruff check tamil_audiobook scripts tests e2e

      - name: Run full pytest suite
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          python -m pytest tests

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund @playwright/test@1.62.1
          npx playwright install chromium

      - name: Run Chromium smoke test
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --project=chromium
