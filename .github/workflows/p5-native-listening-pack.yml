name: p5-native-listening-pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5-native-listening-pack.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p5-native-listening-pack.yml'

concurrency:
  group: p5-native-listening-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  listening-pack:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_arch=%s\n' "$(arch)"
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"

      - name: Install OmniVoice runtime
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Download accepted Stage 1 reference transiently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/private outputs/p5-native-listening-pack
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/english_listening_sample.wav
          printf '%s' 'This is my natural English voice, speaking clearly and smoothly.' \
            > data/private/stage1_accepted/english_reference.txt

      - name: Generate targeted P5 listening cases
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/voice_quality_benchmark.py \
            --reference data/private/stage1_accepted/english_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/english_reference.txt \
            --output-dir outputs/p5-native-listening-pack \
            --case colloquial-ta-01 \
            --case chennai-01 \
            --case chennai-02 \
            --case tanglish-01 \
            --case tanglish-02 \
            --case codeswitch-01 \
            --case codeswitch-02 \
            --case technical-01 \
            --case dialogue-02 \
            --case question-01 \
            --case emotion-01 \
            2> >(tee outputs/p5-native-listening-pack/resource_usage.txt >&2)

      - name: Validate listening pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('outputs/p5-native-listening-pack')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          expected = {
              'colloquial-ta-01', 'chennai-01', 'chennai-02', 'tanglish-01',
              'tanglish-02', 'codeswitch-01', 'codeswitch-02', 'technical-01',
              'dialogue-02', 'question-01', 'emotion-01',
          }
          actual = {case['id'] for case in manifest['cases']}
          if actual != expected:
              raise SystemExit(f'Unexpected case set: {sorted(actual)}')
          for case_id in sorted(expected):
              case_dir = root / case_id
              for name in ('sample.wav', 'sample.mp3', 'report.json'):
                  path = case_dir / name
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f'Missing listening artifact: {path}')
          print('p5_listening_pack_status=READY_FOR_USER_LISTENING')
          print('p5_listening_case_count=' + str(len(expected)))
          PY

      - name: Remove transient voice material and raw resource log
        if: always()
        shell: bash
        run: |
          rm -rf data/private
          rm -f outputs/p5-native-listening-pack/resource_usage.txt

      - name: Upload targeted P5 listening pack
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p5-native-tamil-tanglish-listening-pack
          path: |
            outputs/p5-native-listening-pack/manifest.json
            outputs/p5-native-listening-pack/*/sample.wav
            outputs/p5-native-listening-pack/*/sample.mp3
            outputs/p5-native-listening-pack/*/report.json
          if-no-files-found: error
          retention-days: 7
