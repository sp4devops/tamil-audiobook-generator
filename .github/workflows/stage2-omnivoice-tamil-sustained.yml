name: stage2-omnivoice-tamil-sustained

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-omnivoice-tamil-sustained.yml'
      - 'scripts/benchmark_omnivoice_tamil_sustained.py'
      - 'stage2_requirements.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage2-omnivoice-tamil-sustained
  cancel-in-progress: true

jobs:
  tamil-sustained:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Stage 2 repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"

      - name: Install OmniVoice MLX runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Download accepted Stage 1 voice reference transiently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/private/stage1_accepted outputs/stage2_tamil_sustained
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/english_listening_sample.wav
          printf '%s' 'This is my natural English voice, speaking clearly and smoothly.' \
            > data/private/stage1_accepted/english_reference.txt

      - name: Run sustained 20-step Tamil audiobook benchmark
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/benchmark_omnivoice_tamil_sustained.py \
            --reference data/private/stage1_accepted/english_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/english_reference.txt \
            --output-dir outputs/stage2_tamil_sustained \
            2> >(tee outputs/stage2_tamil_sustained/resource_usage.txt >&2)

      - name: Add RSS to safe sustained report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s outputs/stage2_tamil_sustained/tamil_sustained_report.json ]]; then
            exit 0
          fi
          python - <<'PY'
          import json, re
          from pathlib import Path
          out = Path('outputs/stage2_tamil_sustained')
          report = json.loads((out / 'tamil_sustained_report.json').read_text(encoding='utf-8'))
          usage = (out / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not match:
              raise SystemExit('Could not parse maximum resident set size')
          rss = int(match.group(1))
          report['maximum_resident_set_bytes'] = rss
          report['maximum_resident_set_gib'] = round(rss / (1024 ** 3), 3)
          report['memory_gate_pass'] = report['maximum_resident_set_gib'] <= 3.0
          (out / 'tamil_sustained_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('tamil_sustained_peak_rss_gib=' + str(report['maximum_resident_set_gib']))
          if not report['memory_gate_pass']:
              raise SystemExit('Tamil sustained benchmark exceeded 3 GiB RSS')
          PY

      - name: Remove transient Stage 1 voice material and raw resource log
        if: always()
        shell: bash
        run: |
          rm -rf data/private
          rm -f outputs/stage2_tamil_sustained/resource_usage.txt

      - name: Upload safe Tamil sustained benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-omnivoice-tamil-sustained-benchmark
          path: |
            outputs/stage2_tamil_sustained/tamil_sustained_report.json
            outputs/stage2_tamil_sustained/tamil_segment_00.wav
            outputs/stage2_tamil_sustained/tamil_segment_11.wav
          if-no-files-found: warn
          retention-days: 7
