name: stage2-audiobook-engine

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'tamil_audiobook/**'
      - 'scripts/generate_audiobook.py'
      - 'scripts/audiobook.py'
      - 'scripts/setup_macos.sh'
      - 'scripts/provision_original_voice.sh'
      - 'tests/**'
      - 'stage2_requirements.txt'
      - '.github/workflows/stage2-audiobook-engine.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'tamil_audiobook/**'
      - 'scripts/generate_audiobook.py'
      - 'scripts/audiobook.py'
      - 'scripts/setup_macos.sh'
      - 'scripts/provision_original_voice.sh'
      - 'tests/**'
      - 'stage2_requirements.txt'
      - '.github/workflows/stage2-audiobook-engine.yml'

concurrency:
  group: stage2-audiobook-engine
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Stage 2 repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"

      - name: Install runtime and app dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Run complete app and unit test suite
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup_macos.sh scripts/provision_original_voice.sh
          python scripts/audiobook.py --help | grep -q 'provision-voice'
          node --check tamil_audiobook/static/app.js
          node --check tamil_audiobook/static/progressive.js
          python -m pytest -q tests
          python scripts/audiobook.py --library "$RUNNER_TEMP/listenleaf-library" list
          python - <<'PY'
          from tamil_audiobook.app import app
          routes = {route.path for route in app.routes}
          required = {
              '/', '/api/dashboard', '/api/books/import', '/api/voice-reference',
              '/api/books/{book_id}/estimate', '/api/books/{book_id}/generation',
              '/api/books/{book_id}/chunks/{chunk_index}', '/api/jobs/{job_id}',
              '/api/jobs/{job_id}/cancel'
          }
          missing = required - routes
          if missing:
              raise SystemExit(f'Missing app routes: {sorted(missing)}')
          print('app_route_smoke=PASS')
          print('progressive_route_smoke=PASS')
          print('provisioning_script_syntax=PASS')
          PY

      - name: Download accepted source voice transiently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/accepted-c-source" outputs/audiobook_engine/checkpoints
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir "$RUNNER_TEMP/accepted-c-source"
          test -s "$RUNNER_TEMP/accepted-c-source/mixed_listening_sample.wav"
          cat > "$RUNNER_TEMP/accepted-c-source/reference.txt" <<'EOF'
          வணக்கம், this is my voice. இன்று Kubernetes சரியாக வேலை செய்கிறது.
          EOF
          printf 'DEFAULT_VOICE_WAV=%s\n' "$RUNNER_TEMP/accepted-c-source/mixed_listening_sample.wav" >> "$GITHUB_ENV"
          printf 'DEFAULT_VOICE_TEXT=%s\n' "$RUNNER_TEMP/accepted-c-source/reference.txt" >> "$GITHUB_ENV"
          echo 'accepted_source_voice=transient-only'

      - name: Run real resumable audiobook engine
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/generate_audiobook.py \
            --text-file tests/data/sample_audiobook.txt \
            --reference "$DEFAULT_VOICE_WAV" \
            --reference-text-file "$DEFAULT_VOICE_TEXT" \
            --output-wav outputs/audiobook_engine/sample_audiobook.wav \
            --output-mp3 outputs/audiobook_engine/sample_audiobook.mp3 \
            --report outputs/audiobook_engine/engine_report.json \
            --checkpoint-dir outputs/audiobook_engine/checkpoints \
            --num-steps 20 \
            --guidance-scale 2.5 \
            2> >(tee outputs/audiobook_engine/resource_usage.txt >&2)

      - name: Verify checkpoints resume without re-synthesis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/sample_audiobook.txt \
            --reference "$DEFAULT_VOICE_WAV" \
            --reference-text-file "$DEFAULT_VOICE_TEXT" \
            --output-wav outputs/audiobook_engine/resumed.wav \
            --report outputs/audiobook_engine/resume_report.json \
            --checkpoint-dir outputs/audiobook_engine/checkpoints \
            --num-steps 20 \
            --guidance-scale 2.5
          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path('outputs/audiobook_engine/engine_report.json').read_text())
          resumed = json.loads(Path('outputs/audiobook_engine/resume_report.json').read_text())
          chunks = int(first['chunks'])
          files = list(Path('outputs/audiobook_engine/checkpoints').glob('chunk_*.flac'))
          if len(files) != chunks:
              raise SystemExit(f'checkpoint count mismatch: {len(files)} != {chunks}')
          if int(resumed.get('resumed_chunks', 0)) != chunks:
              raise SystemExit('resume did not reuse every generated chunk')
          print(f'checkpoint_chunks={chunks}')
          print('checkpoint_resume=PASS')
          PY

      - name: Enforce engine acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          out = Path('outputs/audiobook_engine')
          report = json.loads((out / 'engine_report.json').read_text(encoding='utf-8'))
          usage = (out / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not match:
              raise SystemExit('Could not parse maximum resident set size')
          rss = int(match.group(1)); rss_gib = rss / (1024 ** 3)
          report['maximum_resident_set_bytes'] = rss
          report['maximum_resident_set_gib'] = round(rss_gib, 3)
          wall_rtf = float(report['aggregate_rtf'])
          generation_seconds = float(report['generation_seconds'])
          thermal_idle_seconds = float(report.get('thermal_idle_seconds', 0.0))
          audio_seconds = float(report['audio_seconds'])
          active_generation_seconds = max(0.0, generation_seconds - thermal_idle_seconds)
          active_rtf = active_generation_seconds / audio_seconds if audio_seconds > 0 else float('inf')
          report['wall_clock_rtf'] = round(wall_rtf, 4)
          report['active_generation_seconds'] = round(active_generation_seconds, 3)
          report['active_rtf'] = round(active_rtf, 4)
          report['speed_gate_pass'] = active_rtf <= 2.0
          report['memory_gate_pass'] = rss_gib <= 3.0
          report['mp3_export_pass'] = (out / 'sample_audiobook.mp3').stat().st_size > 1000
          report['accepted_voice_config'] = report['num_steps'] == 20 and abs(report['guidance_scale'] - 2.5) < 1e-9
          report['accepted_voice_source'] = 'transient-stage1-artifact'
          report['acceptance_status'] = 'PASS' if all((report['speed_gate_pass'], report['memory_gate_pass'], report['mp3_export_pass'], report['accepted_voice_config'])) else 'FAIL'
          (out / 'engine_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('engine_audio_seconds=' + str(report['audio_seconds']))
          print('engine_wall_rtf=' + str(report['wall_clock_rtf']))
          print('engine_active_rtf=' + str(report['active_rtf']))
          print('engine_thermal_idle_seconds=' + str(report['thermal_idle_seconds']))
          print('engine_peak_rss_gib=' + str(report['maximum_resident_set_gib']))
          print('engine_guidance_scale=' + str(report['guidance_scale']))
          print('engine_acceptance=' + report['acceptance_status'])
          if report['acceptance_status'] != 'PASS':
              raise SystemExit('Stage 2 audiobook engine failed acceptance gates')
          PY

      - name: Remove transient private audio
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/accepted-c-source" outputs/audiobook_engine/checkpoints
          rm -f outputs/audiobook_engine/resource_usage.txt \
                outputs/audiobook_engine/resumed.wav outputs/audiobook_engine/resume_report.json \
                outputs/audiobook_engine/sample_audiobook.wav outputs/audiobook_engine/sample_audiobook.mp3

      - name: Upload privacy-safe acceptance report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-audiobook-engine-acceptance-report
          path: outputs/audiobook_engine/engine_report.json
          if-no-files-found: error
          retention-days: 7
