name: stage2-audiobook-engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'tamil_audiobook/**'
      - 'scripts/generate_audiobook.py'
      - 'scripts/audiobook.py'
      - 'tests/**'
      - 'stage2_requirements.txt'
      - '.github/workflows/stage2-audiobook-engine.yml'

concurrency:
  group: stage2-audiobook-engine
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Stage 2 repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"

      - name: Install runtime and app dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Run complete app and unit test suite
        shell: bash
        run: |
          set -euo pipefail
          node --check tamil_audiobook/static/app.js
          python -m pytest -q tests
          python scripts/audiobook.py --library "$RUNNER_TEMP/listenleaf-library" list
          python - <<'PY'
          from tamil_audiobook.app import app
          routes = {route.path for route in app.routes}
          required = {'/', '/api/dashboard', '/api/books/import', '/api/voice-reference', '/api/books/{book_id}/estimate'}
          missing = required - routes
          if missing:
              raise SystemExit(f'Missing app routes: {sorted(missing)}')
          print('app_route_smoke=PASS')
          PY

      - name: Materialize final 11-minute accepted-C default voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/accepted-c-default" outputs/audiobook_engine
          python - <<'PY'
          from pathlib import Path
          from tamil_audiobook.voice import DEFAULT_VOICE_PROVENANCE, materialize_default_voice

          root = Path(__import__('os').environ['RUNNER_TEMP']) / 'accepted-c-default'
          audio, transcript = materialize_default_voice(root)
          text_path = root / 'reference.txt'
          text_path.write_text(transcript, encoding='utf-8')
          if DEFAULT_VOICE_PROVENANCE != 'Final 11-minute accepted-C audiobook MP3':
              raise SystemExit('Unexpected default voice provenance')
          print('default_voice_provenance=' + DEFAULT_VOICE_PROVENANCE)
          print('default_voice_materialized=PASS')
          PY
          test -s "$RUNNER_TEMP/accepted-c-default/final_11min_accepted_c.wav"
          test -s "$RUNNER_TEMP/accepted-c-default/reference.txt"

      - name: Run real audiobook engine with packaged accepted C default
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/generate_audiobook.py \
            --text-file tests/data/sample_audiobook.txt \
            --reference "$RUNNER_TEMP/accepted-c-default/final_11min_accepted_c.wav" \
            --reference-text-file "$RUNNER_TEMP/accepted-c-default/reference.txt" \
            --output-wav outputs/audiobook_engine/sample_audiobook.wav \
            --output-mp3 outputs/audiobook_engine/sample_audiobook.mp3 \
            --report outputs/audiobook_engine/engine_report.json \
            --num-steps 20 \
            --guidance-scale 2.5 \
            2> >(tee outputs/audiobook_engine/resource_usage.txt >&2)

      - name: Enforce engine acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          out = Path('outputs/audiobook_engine')
          report = json.loads((out / 'engine_report.json').read_text(encoding='utf-8'))
          usage = (out / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not match:
              raise SystemExit('Could not parse maximum resident set size')
          rss = int(match.group(1))
          rss_gib = rss / (1024 ** 3)
          report['maximum_resident_set_bytes'] = rss
          report['maximum_resident_set_gib'] = round(rss_gib, 3)
          report['speed_gate_pass'] = report['aggregate_rtf'] <= 2.0
          report['memory_gate_pass'] = rss_gib <= 3.0
          report['mp3_export_pass'] = (out / 'sample_audiobook.mp3').stat().st_size > 1000
          report['accepted_voice_config'] = (
              report['num_steps'] == 20 and abs(report['guidance_scale'] - 2.5) < 1e-9
          )
          report['default_voice_provenance'] = 'Final 11-minute accepted-C audiobook MP3'
          report['acceptance_status'] = 'PASS' if all((
              report['speed_gate_pass'], report['memory_gate_pass'],
              report['mp3_export_pass'], report['accepted_voice_config']
          )) else 'FAIL'
          (out / 'engine_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('engine_audio_seconds=' + str(report['audio_seconds']))
          print('engine_rtf=' + str(report['aggregate_rtf']))
          print('engine_peak_rss_gib=' + str(report['maximum_resident_set_gib']))
          print('engine_guidance_scale=' + str(report['guidance_scale']))
          print('default_voice_provenance=' + report['default_voice_provenance'])
          print('engine_acceptance=' + report['acceptance_status'])
          if report['acceptance_status'] != 'PASS':
              raise SystemExit('Stage 2 audiobook engine failed acceptance gates')
          PY

      - name: Remove transient material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/accepted-c-default"
          rm -f outputs/audiobook_engine/resource_usage.txt

      - name: Upload safe audiobook engine artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-audiobook-engine-acceptance
          path: |
            outputs/audiobook_engine/engine_report.json
            outputs/audiobook_engine/sample_audiobook.wav
            outputs/audiobook_engine/sample_audiobook.mp3
          if-no-files-found: warn
          retention-days: 7
