name: stage2-identity-guidance-sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-identity-guidance-sweep.yml'

concurrency:
  group: stage2-identity-guidance-sweep
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Stage 2 repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Recover accepted Stage 1 references transiently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/private/stage1_accepted outputs/identity_guidance_sweep
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/english_listening_sample.wav
          test -s data/private/stage1_accepted/mixed_listening_sample.wav

          python - <<'PY'
          from pathlib import Path
          english = "This is my natural English voice, speaking clearly and smoothly."
          mixed = "வணக்கம், this is my voice. இன்று Kubernetes சரியாக வேலை செய்கிறது."
          root = Path('data/private/stage1_accepted')
          (root / 'mixed_reference.txt').write_text(mixed, encoding='utf-8')
          (root / 'combined_reference.txt').write_text(english + ' ' + mixed, encoding='utf-8')
          PY

          ffmpeg -y -hide_banner -loglevel error \
            -i data/private/stage1_accepted/english_listening_sample.wav \
            -i data/private/stage1_accepted/mixed_listening_sample.wav \
            -filter_complex '[0:a][1:a]concat=n=2:v=0:a=1[out]' \
            -map '[out]' -ac 1 -ar 24000 \
            data/private/stage1_accepted/combined_reference.wav
          test -s data/private/stage1_accepted/combined_reference.wav

      - name: Generate B baseline mixed reference guidance 2.0
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/identity_tone_sample.txt \
            --reference data/private/stage1_accepted/mixed_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/mixed_reference.txt \
            --output-wav outputs/identity_guidance_sweep/B_mixed_g2_0.wav \
            --output-mp3 outputs/identity_guidance_sweep/B_mixed_g2_0.mp3 \
            --report outputs/identity_guidance_sweep/B_report.json \
            --num-steps 20 --guidance-scale 2.0

      - name: Generate C stronger mixed reference guidance 2.5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/identity_tone_sample.txt \
            --reference data/private/stage1_accepted/mixed_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/mixed_reference.txt \
            --output-wav outputs/identity_guidance_sweep/C_mixed_g2_5.wav \
            --output-mp3 outputs/identity_guidance_sweep/C_mixed_g2_5.mp3 \
            --report outputs/identity_guidance_sweep/C_report.json \
            --num-steps 20 --guidance-scale 2.5

      - name: Generate D combined reference guidance 2.5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_audiobook.py \
            --text-file tests/data/identity_tone_sample.txt \
            --reference data/private/stage1_accepted/combined_reference.wav \
            --reference-text-file data/private/stage1_accepted/combined_reference.txt \
            --output-wav outputs/identity_guidance_sweep/D_combined_g2_5.wav \
            --output-mp3 outputs/identity_guidance_sweep/D_combined_g2_5.mp3 \
            --report outputs/identity_guidance_sweep/D_report.json \
            --num-steps 20 --guidance-scale 2.5

      - name: Validate safe outputs
        shell: bash
        run: |
          set -euo pipefail
          for name in B_mixed_g2_0 C_mixed_g2_5 D_combined_g2_5; do
            test -s "outputs/identity_guidance_sweep/${name}.wav"
            test -s "outputs/identity_guidance_sweep/${name}.mp3"
          done

      - name: Remove transient references
        if: always()
        shell: bash
        run: rm -rf data/private

      - name: Upload safe identity sweep samples
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-identity-guidance-sweep
          path: outputs/identity_guidance_sweep/
          if-no-files-found: error
          retention-days: 7
