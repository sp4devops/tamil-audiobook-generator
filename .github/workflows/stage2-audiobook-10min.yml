name: stage2-audiobook-10min

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-audiobook-10min.yml'

concurrency:
  group: stage2-audiobook-10min
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sustained:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"

      - name: Install pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Run unit tests
        shell: bash
        run: python -m pytest -q tests/test_engine.py tests/test_benchmark_contract.py

      - name: Build safe long-form test text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/audiobook_10min data/private/stage1_accepted
          python - <<'PY'
          from pathlib import Path
          base = Path('tests/data/sample_audiobook.txt').read_text(encoding='utf-8').strip()
          Path('outputs/audiobook_10min/long_test.txt').write_text('\n\n'.join([base] * 7), encoding='utf-8')
          PY

      - name: Recover human-accepted C reference transiently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 31974866774 \
            --repo sp4devops/tamil-voice-clone \
            --name voice-001-stage1-apple-silicon-listening-samples \
            --dir data/private/stage1_accepted
          test -s data/private/stage1_accepted/mixed_listening_sample.wav
          python - <<'PY'
          from pathlib import Path
          reference = "வணக்கம், this is my voice. இன்று Kubernetes சரியாக வேலை செய்கிறது."
          Path('data/private/stage1_accepted/reference.txt').write_text(reference, encoding='utf-8')
          PY

      - name: Generate sustained audiobook with accepted C settings
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/generate_audiobook.py \
            --text-file outputs/audiobook_10min/long_test.txt \
            --reference data/private/stage1_accepted/mixed_listening_sample.wav \
            --reference-text-file data/private/stage1_accepted/reference.txt \
            --output-wav outputs/audiobook_10min/audiobook_10min.wav \
            --output-mp3 outputs/audiobook_10min/audiobook_10min.mp3 \
            --report outputs/audiobook_10min/report.json \
            --num-steps 20 \
            --guidance-scale 2.5 \
            2> >(tee outputs/audiobook_10min/resource_usage.txt >&2)

      - name: Enforce sustained acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          out = Path('outputs/audiobook_10min')
          report = json.loads((out / 'report.json').read_text(encoding='utf-8'))
          usage = (out / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not m:
              raise SystemExit('Could not parse maximum resident set size')
          rss = int(m.group(1))
          report['maximum_resident_set_bytes'] = rss
          report['maximum_resident_set_gib'] = round(rss / 1024**3, 3)
          report['audio_duration_gate_pass'] = report['audio_seconds'] >= 540.0
          report['speed_gate_pass'] = report['aggregate_rtf'] <= 2.0
          report['memory_gate_pass'] = rss <= 3 * 1024**3
          report['accepted_voice_config'] = report['num_steps'] == 20 and abs(report['guidance_scale'] - 2.5) < 1e-9
          report['mp3_export_pass'] = (out / 'audiobook_10min.mp3').stat().st_size > 1000
          report['acceptance_status'] = 'PASS' if all((
              report['audio_duration_gate_pass'], report['speed_gate_pass'], report['memory_gate_pass'],
              report['accepted_voice_config'], report['mp3_export_pass']
          )) else 'FAIL'
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('audio_seconds=' + str(report['audio_seconds']))
          print('aggregate_rtf=' + str(report['aggregate_rtf']))
          print('maximum_resident_set_gib=' + str(report['maximum_resident_set_gib']))
          print('acceptance_status=' + report['acceptance_status'])
          if report['acceptance_status'] != 'PASS':
              raise SystemExit('10-minute sustained audiobook acceptance failed')
          PY

      - name: Remove private and oversized transient files
        if: always()
        shell: bash
        run: |
          rm -rf data/private
          rm -f outputs/audiobook_10min/resource_usage.txt
          rm -f outputs/audiobook_10min/long_test.txt
          rm -f outputs/audiobook_10min/audiobook_10min.wav

      - name: Upload sustained report and MP3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-audiobook-10min-acceptance
          path: |
            outputs/audiobook_10min/report.json
            outputs/audiobook_10min/audiobook_10min.mp3
          if-no-files-found: warn
          retention-days: 7
