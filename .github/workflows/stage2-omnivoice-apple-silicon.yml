name: stage2-omnivoice-apple-silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-omnivoice-apple-silicon.yml'
      - 'scripts/benchmark_omnivoice_mlx.py'
      - 'stage2_requirements.txt'

concurrency:
  group: stage2-omnivoice-apple-silicon
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(arch)" = 'arm64'
          printf 'runner_arch=%s\n' "$(arch)"
          printf 'runner_memory_bytes=%s\n' "$(sysctl -n hw.memsize)"
          sw_vers

      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r stage2_requirements.txt

      - name: Create non-private synthetic clone reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/stage2_omnivoice data/transient
          REF_TEXT='This is a synthetic reference voice created only for the Stage Two performance benchmark.'
          say -v Samantha -o data/transient/reference.aiff "$REF_TEXT"
          ffmpeg -y -hide_banner -loglevel error \
            -i data/transient/reference.aiff -ac 1 -ar 24000 \
            data/transient/reference.wav
          printf '%s' "$REF_TEXT" > data/transient/reference.txt

      - name: Run sustained cloned-voice benchmark
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l python scripts/benchmark_omnivoice_mlx.py \
            --reference data/transient/reference.wav \
            --reference-text "$(cat data/transient/reference.txt)" \
            --output-dir outputs/stage2_omnivoice \
            2> >(tee outputs/stage2_omnivoice/resource_usage.txt >&2)

      - name: Build final Apple Silicon gate report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          out = Path('outputs/stage2_omnivoice')
          runtime = json.loads((out / 'omnivoice_runtime.json').read_text(encoding='utf-8'))
          usage = (out / 'resource_usage.txt').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(?m)^\s*(\d+)\s+maximum resident set size\s*$', usage)
          if not match:
              raise SystemExit('Could not parse macOS maximum resident set size')

          rss_bytes = int(match.group(1))
          rss_gib = rss_bytes / (1024 ** 3)
          memory_pass = rss_gib <= 3.0
          accepted = bool(runtime['speed_gate_pass'] and memory_pass)
          final = {
              **runtime,
              'maximum_resident_set_bytes': rss_bytes,
              'maximum_resident_set_gib': round(rss_gib, 3),
              'memory_gate_pass': memory_pass,
              'status': 'PASS' if accepted else 'FAIL',
          }
          (out / 'stage2_apple_silicon_benchmark.json').write_text(
              json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('stage2_speed_gate_pass=' + str(runtime['speed_gate_pass']).lower())
          print('stage2_peak_rss_gib=' + str(final['maximum_resident_set_gib']))
          print('stage2_memory_gate_pass=' + str(memory_pass).lower())
          if not accepted:
              raise SystemExit('Stage 2 OmniVoice Apple Silicon benchmark failed an acceptance gate')
          PY

      - name: Remove transient reference and raw resource log
        if: always()
        shell: bash
        run: |
          rm -rf data/transient
          rm -f outputs/stage2_omnivoice/resource_usage.txt

      - name: Upload safe benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage2-omnivoice-apple-silicon-benchmark
          path: |
            outputs/stage2_omnivoice/omnivoice_runtime.json
            outputs/stage2_omnivoice/stage2_apple_silicon_benchmark.json
            outputs/stage2_omnivoice/synthetic_segment_00.wav
            outputs/stage2_omnivoice/synthetic_segment_11.wav
          if-no-files-found: warn
          retention-days: 7
